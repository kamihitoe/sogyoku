#baseURL: 'https://sogyoku.netlify.app/'
languageCode: 'zh-CN'
title: 'ソギョク 的域'
theme: 'hextra'

# KaTeX 字体等原始文件直接从 assets 发布，使 katex.min.css 中的 url(fonts/...) 保持有效
staticDir:
  - static
  - assets/katex

params:
  navbar:
    displayTitle: true
    displayLogo: false # 不显示logo
    logo:
      path: images/logo.svg
      # dark: images/logo-dark.svg
      link: /
  footer:
    # display: true
    # content: ""

  theme:
    default: system
    displayToggle: true

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: normal
    contextMenu:
      enable: true
  
  imageZoom:
    enable: true # 开启图片缩放
    js: "medium-zoom.min.js" # 本地资源，避免构建时联网

  displayUpdatedDate: false # 是否显示更新日期
  dateFormat: "2006/1/2" # 日期格式
  highlight:
    copy:
      enable: true
      display: always # hover | always
  
  # 显示标签
  blog:
    list:
      displayTags: true
  toc:
    displayTags: true
  math:
    engine: katex
    katex:
      # 本地资源（KaTeX 0.16.22）。base 为纯路径（不以 http 开头）：
      #   - css 存在 -> 由 resources.Get 读取 assets 中的 css，不改写字体 url；
      #     字体相对路径 fonts/ 由 hugo.yaml 的 staticDir (assets/katex) 原样发布
      #   - js / contrib 通过下方 assets 列表发布，渲染由 Hextra 的 transform.ToMath 完成
      base: "katex"
      css: "katex/katex.min.css"
      assets:
        - "katex/katex.min.js"
        - "katex/contrib/auto-render.min.js"

# 输出格式
outputs:
  page: [html, markdown]
  section: [html, rss, markdown]


markup:
  goldmark:
    renderer:
      unsafe: true # 允许HTML
      hardWraps: true # 单个换行符也渲染为 <br>
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ["$$", "$$"]]
          inline: [['\(', '\)'],['$', '$']]
        enable: true
  highlight:
    noClasses: false # 启用代码高亮

menu:
  main:
    - name: 首页
      pageRef: /
      weight: 1
    - name: 笔记
      pageRef: /note
      weight: 2
    - name: 题解
      pageRef: /sol
      weight: 3
    - name: 写作
      pageRef: /writing
      weight: 4
    - name: 生活记录
      pageRef: /life
      weight: 5
    - name: 杂谈
      pageRef: /misc
      weight: 6
    - name: 关于
      pageRef: /about
      weight: 10    
    - name: 搜索
      weight: 20
      params:
        type: search
    - name: 切换主题
      weight: 40
      params:
        type: theme-toggle
        label: false # 不显示文字，只显示图标